name: ci

# Runs on every push and every pull request. A green run on the commit you tag is the evidence the capstone checker
# reads: the checker never runs your code itself. This file is part of the template. Do not edit it: the checker
# compares it with the template's copy.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capstone:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      # The shape of the capstone, and your plan gate run on made-up plans. No Docker engine is needed.
      - name: Capstone checks
        run: node --test challenges/challenge-14-capstone/capstone.test.mjs

      - name: Format
        run: terraform fmt -check -recursive capstone

      - name: Validate both environments
        run: |
          for d in capstone/envs/dev capstone/envs/prod; do
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
          done

      # The provider is mocked, so the tests need no Docker engine and no state.
      - name: Terraform tests
        run: |
          terraform -chdir=capstone init -backend=false -input=false
          terraform -chdir=capstone test
